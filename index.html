body{font-family:'Share Tech Mono','Courier New',monospace;background:radial-gradient(ellipse at 50% 0%,var(--bg-glow) 0%,transparent 55%),var(--bg-outer);color:#ccc;user-select:none;display:flex;align-items:center;justify-content:center;transition:background .6s;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.system{display:flex;gap:12px;align-items:stretch;width:100%;max-width:1400px;height:100%;max-height:680px}
.speaker{flex:0 0 150px;display:flex;flex-direction:column}
.cabinet{flex:1;position:relative;border-radius:14px;background:linear-gradient(160deg,var(--cabinet-1) 0%,var(--cabinet-2) 40%,var(--cabinet-3) 100%);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.18),inset 0 -4px 10px rgba(0,0,0,.45),inset 4px 0 8px rgba(0,0,0,.2),inset -4px 0 8px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;padding:12px 8px 14px;gap:9px;overflow:hidden;transition:background .6s}
.cabinet:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(255,255,255,.02) 3px,rgba(255,255,255,.02) 4px)}
body.playing .cabinet{animation:cabVib .38s ease-in-out infinite}
@keyframes cabVib{0%,100%{transform:translate(0,0)}25%{transform:translate(.4px,-.3px)}50%{transform:translate(-.3px,.4px)}75%{transform:translate(.3px,.3px)}}
.tube-lamps{display:flex;gap:10px;justify-content:center;width:100%;height:26px;align-items:flex-end;z-index:2}
.tube{width:9px;height:22px;border-radius:5px;background:radial-gradient(ellipse at 50% 28%,#fff4cf 0%,#ffc061 38%,#d87518 68%,#6b2d05 100%);box-shadow:0 0 10px rgba(255,170,60,.75),0 0 22px rgba(255,120,20,.35),inset 0 1px 2px rgba(255,255,255,.75);animation:tubeFlicker 4.2s infinite ease-in-out}
.tube:nth-child(2){animation-delay:.8s}.tube:nth-child(3){animation-delay:1.5s}
body:not(.on) .tube{opacity:.16;box-shadow:none;animation:none}
body.playing .tube{animation-duration:2.4s}
@keyframes tubeFlicker{0%,100%{opacity:.82;filter:brightness(.95)}18%{opacity:1;filter:brightness(1.18)}33%{opacity:.74}52%{opacity:1}69%{opacity:.86}84%{opacity:.98}}
.tweeter{width:44px;height:44px;border-radius:50%;position:relative;background:radial-gradient(circle at 38% 32%,var(--tweeter) 0%,var(--tweeter-dark) 100%);box-shadow:inset 0 3px 6px rgba(0,0,0,.75),inset 0 -1px 2px rgba(255,255,255,.15),0 3px 8px rgba(0,0,0,.4)}
.tweeter:after{content:'';position:absolute;top:14%;left:18%;width:34%;height:26%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.35),transparent 70%);filter:blur(1px)}
body.playing .tweeter{animation:tweeterPulse .19s ease-in-out infinite}
@keyframes tweeterPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
.mid-driver{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--cabinet-2) 0%,var(--cabinet-3) 100%);box-shadow:inset 0 4px 10px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.mid-cone{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 38% 32%,var(--speaker-cone) 0%,var(--speaker-cone-dark) 100%);box-shadow:inset 0 2px 6px rgba(0,0,0,.65),inset 0 -2px 4px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.mid-cone .cap{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 36% 30%,var(--speaker-cap) 0%,var(--speaker-cap-dark) 100%);box-shadow:inset 0 1px 3px rgba(255,255,255,.4),0 2px 5px rgba(0,0,0,.5)}
body.playing .mid-cone{animation:wooferPump .38s ease-in-out infinite .04s}
.woofer{width:118px;height:118px;border-radius:50%;position:relative;margin-top:auto;background:radial-gradient(circle at 50% 50%,var(--cabinet-2) 0%,var(--cabinet-3) 100%);box-shadow:inset 0 5px 14px rgba(0,0,0,.75),inset 0 -2px 5px rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.woofer:before{content:'';position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,transparent 62%,rgba(0,0,0,.5) 64%,rgba(100,100,110,.35) 72%,rgba(0,0,0,.55) 80%)}
.woofer:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 4%,var(--screw) 0 2.5px,var(--cabinet-3) 2.5px 4px,transparent 4px),radial-gradient(circle at 50% 96%,var(--screw) 0 2.5px,var(--cabinet-3) 2.5px 4px,transparent 4px),radial-gradient(circle at 4% 50%,var(--screw) 0 2.5px,var(--cabinet-3) 2.5px 4px,transparent 4px),radial-gradient(circle at 96% 50%,var(--screw) 0 2.5px,var(--cabinet-3) 2.5px 4px,transparent 4px)}
.woofer-cone{width:86px;height:86px;border-radius:50%;position:relative;z-index:2;background:radial-gradient(circle at 38% 32%,var(--speaker-cone) 0%,var(--speaker-cone-dark) 100%);box-shadow:inset 0 3px 10px rgba(0,0,0,.75),inset 0 -3px 6px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.woofer-cone:before{content:'';position:absolute;inset:7px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 5px,rgba(0,0,0,.18) 5px 6px)}
.dust-cap{width:32px;height:32px;border-radius:50%;position:relative;z-index:3;background:radial-gradient(circle at 35% 30%,var(--speaker-cap) 0%,var(--speaker-cap-dark) 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.6)}
body.playing .woofer-cone{animation:wooferPump .38s ease-in-out infinite}
@keyframes wooferPump{0%,100%{transform:scale(1)}42%{transform:scale(1.075)}70%{transform:scale(.985)}}
.spk-badge{font-family:'Orbitron',sans-serif;font-weight:700;font-size:9px;letter-spacing:1.5px;color:var(--badge-color);margin-top:4px}
.bass-port{width:24px;height:24px;border-radius:50%;position:absolute;bottom:44px;background:radial-gradient(circle,#000 55%,var(--cabinet-2) 75%,var(--cabinet-1) 100%);box-shadow:inset 0 3px 6px rgba(0,0,0,1)}
.speaker.left .bass-port{right:10px}.speaker.right .bass-port{left:10px}
.console{flex:1;position:relative;border-radius:16px;min-width:0;background:linear-gradient(180deg,var(--console-1) 0%,var(--console-2) 12%,var(--console-3) 100%);box-shadow:0 25px 60px rgba(0,0,0,.55),inset 0 2px 2px rgba(255,255,255,.22),inset 0 -5px 12px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:10px 12px;overflow:hidden;transition:background .6s}
.console:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.015) 2px,rgba(255,255,255,.015) 3px)}
.screw{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--screw),var(--cabinet-3) 70%);box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.6)}
.screw:after{content:'';position:absolute;inset:2.5px 1px;background:var(--cabinet-3);border-radius:1px}
.screw.tl{top:7px;left:7px}.screw.tr{top:7px;right:7px}.screw.bl{bottom:7px;left:7px}.screw.br{bottom:7px;right:7px}
.console-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 6px 8px;z-index:2;flex-wrap:nowrap;overflow:hidden}
.brand-wrap{min-width:0;flex:1}
.brand{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(12px,2.4vw,18px);letter-spacing:2px;color:var(--brand-color);text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 1px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:'VT323',monospace;font-size:clamp(8px,1.6vw,11px);letter-spacing:1px;color:var(--label-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:clamp(8px,1.6vw,14px);flex-shrink:0}
.theme-dots{display:flex;align-items:center;gap:clamp(5px,1.1vw,8px)}
.theme-dot{width:clamp(18px,4.2vw,24px);height:clamp(18px,4.2vw,24px);border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.18);transition:all .25s;box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 2px 5px rgba(0,0,0,.35);flex-shrink:0}
.theme-dot:hover{transform:scale(1.08)}
.theme-dot.active{border-color:var(--screen-text);box-shadow:0 0 10px var(--ring-color);transform:scale(1.1)}
.td-dark{background:linear-gradient(135deg,#303038,#121216)}
.td-gold{background:linear-gradient(135deg,#c4a86c,#6e582c)}
.td-carbon{background:linear-gradient(135deg,#333,#000)}
.td-retro{background:linear-gradient(135deg,#7a5a38,#1a1008)}
.led-row{display:flex;gap:6px;align-items:center}
.status-led{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 1px 2px rgba(0,0,0,.8);transition:all .4s}
.power-led-mini{background:#4a1414}
body.on .power-led-mini{background:var(--power-led);box-shadow:0 0 9px var(--power-led);animation:ledPulse 2s infinite}
.network-led{background:#2a4a1a}
.network-led.online{background:#00ff44;box-shadow:0 0 9px #00ff44}
.network-led.offline{background:#ff4400;box-shadow:0 0 9px #ff4400;animation:ledPulse 1s infinite}
.network-led.buffering{background:#ffaa00;box-shadow:0 0 9px #ffaa00;animation:ledPulse .5s infinite}
@keyframes ledPulse{50%{opacity:.45}}
.pwr-btn{width:clamp(44px,9.5vw,56px);height:clamp(34px,7vw,44px);border-radius:10px;background:var(--btn-bg);border:1px solid rgba(0,0,0,.5);cursor:pointer;color:var(--btn-color);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;box-shadow:inset 0 2px 3px rgba(255,255,255,.22),inset 0 -3px 6px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.45);transition:transform .1s,color .3s;z-index:10}
.pwr-btn svg{width:clamp(19px,4.4vw,25px);height:clamp(19px,4.4vw,25px);pointer-events:none}
.pwr-btn:before{content:'';position:absolute;inset:-3px;border-radius:12px;border:2px solid rgba(255,59,48,.16);transition:all .35s;pointer-events:none}
body.on .pwr-btn{color:#ff9a90}
body.on .pwr-btn:before{border-color:rgba(255,59,48,.6);box-shadow:0 0 10px rgba(255,59,48,.4)}
.pwr-btn:active{transform:translateY(2px);box-shadow:inset 0 3px 8px rgba(0,0,0,.7)}
.mid-section{z-index:2;flex:1;min-height:0;display:flex;gap:8px}
.features-col{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(4px,1vh,8px);justify-content:center}
.fbtn{width:clamp(42px,9vw,54px);height:clamp(42px,9vw,54px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--btn-bg);border:1px solid rgba(0,0,0,.35);border-radius:11px;cursor:pointer;color:var(--btn-color);box-shadow:inset 0 1px 2px rgba(255,255,255,.15),0 2px 5px rgba(0,0,0,.35);overflow:hidden;transition:all .15s;flex-shrink:0}
.fbtn .fico{font-size:clamp(15px,3.6vw,19px);line-height:1}
.fbtn .ftxt{font-size:clamp(7px,1.6vw,9px);letter-spacing:.3px;line-height:1;white-space:nowrap}
body.on .fbtn{color:var(--btn-active-color)}
.fbtn:active{transform:translateY(1px)}
.fbtn.active{border-color:var(--ring-color);box-shadow:0 0 12px var(--ring-color),inset 0 0 8px var(--screen-glow);color:var(--screen-text)}
.screen-frame{flex:1;min-width:0;border-radius:10px;padding:4px;background:linear-gradient(180deg,var(--cabinet-3),var(--cabinet-1));box-shadow:inset 0 3px 8px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.15);display:flex;min-height:0}
.screen{position:relative;border-radius:7px;overflow:hidden;flex:1;background:var(--screen-bg);display:flex;flex-direction:column;padding:8px 12px;gap:4px;transition:all .5s;min-height:0}
body:not(.on) .screen{opacity:.4}
body:not(.on) .screen-content{opacity:.1;filter:blur(1px)}
body.on .screen{box-shadow:inset 0 0 40px var(--screen-glow),inset 0 0 100px rgba(0,0,0,.3)}
.screen:before{content:'';position:absolute;inset:0;z-index:20;pointer-events:none;background:linear-gradient(165deg,rgba(255,255,255,.06) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.03) 100%)}
.screen:after{content:'';position:absolute;inset:0;z-index:19;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px)}
.screen-content{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;transition:opacity .6s;position:relative;z-index:2}
.scr-status-row{display:flex;justify-content:space-between;align-items:center;font-family:'VT323',monospace;font-size:clamp(11px,2vw,14px);letter-spacing:1px;color:var(--screen-dim);text-shadow:0 0 6px var(--screen-glow);opacity:.9;gap:8px;flex-shrink:0}
.scr-status-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr-status-row .live{color:#ff5a5a;text-shadow:0 0 8px rgba(255,90,90,.7);display:flex;align-items:center;gap:4px;flex:0 0 auto}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ff5a5a;box-shadow:0 0 8px #ff5a5a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.scr-station{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(15px,3vh,26px);letter-spacing:1.5px;color:var(--screen-text);text-shadow:0 0 14px var(--screen-glow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;flex-shrink:0}
.scr-marquee-wrap{overflow:hidden;white-space:nowrap;height:18px;border-top:1px solid var(--screen-glow);border-bottom:1px solid var(--screen-glow);display:flex;align-items:center;flex-shrink:0}
.scr-marquee{font-family:'VT323',monospace;font-size:clamp(13px,2.4vh,17px);letter-spacing:1px;color:var(--screen-dim);text-shadow:0 0 8px var(--screen-glow);display:inline-block;padding-left:100%;animation:marquee 26s linear infinite}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.scr-mid{display:flex;gap:10px;align-items:stretch;flex:1;min-height:0}
.eq{position:relative;flex:1.4;min-height:0;overflow:hidden;border-radius:6px;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.06));box-shadow:inset 0 1px 5px rgba(0,0,0,.5),0 0 12px var(--screen-glow)}
.eq canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.scr-right{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:4px;min-width:0}
.scr-time{font-family:'VT323',monospace;font-size:clamp(26px,5vh,48px);line-height:.9;color:var(--screen-text);letter-spacing:2px;text-shadow:0 0 14px var(--screen-glow)}

<body data-theme="dark">

<script>
document.addEventListener('touchmove',e=>{if(!e.target.closest('.stations-grid,.eq-grid,.search-box,.fader,.seek-track,.eq'))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
function toggleFullscreen(){const el=document.documentElement;if(!document.fullscreenElement&&!document.webkitFullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);else(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
const favorites=JSON.parse(localStorage.getItem('favs')||'[]');

const analyzerCanvas=document.getElementById('analyzerCanvas'),canvasCtx=analyzerCanvas.getContext('2d'),MODES=['bars','mirror','wave','radial'];let analyzerMode=localStorage.getItem('analyzerMode')||'bars';if(!MODES.includes(analyzerMode))analyzerMode='bars';const BANDS=64,smooth=new Float32Array(BANDS),peaks=new Float32Array(BANDS),waveVals=new Float32Array(128);let syntheticPhase=0,colors={primary:'#35c8ff',bright:'#aee9ff',deep:'#0a5a8a',bg:'#02101d'};function updateThemeColors(){const cs=getComputedStyle(document.body);colors.primary=cs.getPropertyValue('--blue').trim()||'#35c8ff';colors.bright=cs.getPropertyValue('--blue-bright').trim()||'#aee9ff';colors.deep=cs.getPropertyValue('--blue-deep').trim()||'#0a5a8a';colors.bg=cs.getPropertyValue('--screen-bg').trim()||'#02101d'}function withAlpha(c,a){c=(c||'').trim();if(c.startsWith('#')){let h=c.slice(1);if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}return c}function resizeAnalyzer(){const dpr=Math.min(window.devicePixelRatio||1,2),r=analyzerCanvas.getBoundingClientRect();analyzerCanvas.width=Math.max(1,Math.floor(r.width*dpr));analyzerCanvas.height=Math.max(1,Math.floor(r.height*dpr));canvasCtx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resizeAnalyzer);window.addEventListener('orientationchange',()=>setTimeout(resizeAnalyzer,300));document.addEventListener('fullscreenchange',()=>setTimeout(resizeAnalyzer,250));document.addEventListener('webkitfullscreenchange',()=>setTimeout(resizeAnalyzer,250));if(window.ResizeObserver)new ResizeObserver(resizeAnalyzer).observe(analyzerCanvas);analyzerCanvas.addEventListener('click',()=>{const i=MODES.indexOf(analyzerMode);analyzerMode=MODES[(i+1)%MODES.length];localStorage.setItem('analyzerMode',analyzerMode)});
function generateSynthetic(dt){const energy=isPlaying?(.55+volume*.45):.07;for(let i=0;i<BANDS;i++){const x=i/(BANDS-1),bass=Math.pow(1-x,1.55),mid=Math.exp(-Math.pow((x-.34)*3.1,2)),high=Math.pow(x,.82)*.42,beat=Math.pow(Math.max(0,Math.sin(syntheticPhase*2.05)),10)*.58,flutter=Math.sin(syntheticPhase*7.1+i*.36)*.12+Math.sin(syntheticPhase*13.4+i*.18)*.08,noise=(Math.random()-.5)*.09;let v=(bass*.68+mid*.46+high*.24+beat*bass+flutter+noise)*energy;v=Math.max(.02,Math.min(1,v))*255;smooth[i]+=(v-smooth[i])*(isPlaying?.24:.08);peaks[i]=Math.max(peaks[i]-dt*70,smooth[i])}}function generateSyntheticWave(){const amp=isPlaying?(.34+volume*.42):.05;for(let i=0;i<waveVals.length;i++){const x=i/waveVals.length,v=Math.sin(x*Math.PI*4+syntheticPhase*3.1)*.45+Math.sin(x*Math.PI*9+syntheticPhase*5.2)*.24+Math.sin(x*Math.PI*17+syntheticPhase*2.1)*.1+(Math.random()-.5)*.06;waveVals[i]=v*amp}}function mapRealToBands(dt){if(!realFreq)return;const bins=realFreq.length;for(let i=0;i<BANDS;i++){const t=i/(BANDS-1),start=Math.floor(Math.pow(t,2)*(bins-1)),end=Math.min(bins,Math.max(start+1,Math.floor(Math.pow(t+1/(BANDS-1),2)*(bins-1))));let sum=0,count=0;for(let j=start;j<end;j++){sum+=realFreq[j];count++}const v=count?sum/count:0;smooth[i]+=(v-smooth[i])*.34;peaks[i]=Math.max(peaks[i]-dt*72,smooth[i])}}function updateAnalyzerData(dt){syntheticPhase+=dt*(isPlaying?1.45:.25);if(activeIsLocal&&analyser&&isPlaying&&realFreq){analyser.getByteFrequencyData(realFreq);if(realWave)analyser.getByteTimeDomainData(realWave);mapRealToBands(dt)}else{generateSynthetic(dt);generateSyntheticWave()}}
function roundedBarPath(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
function drawAnalyzer(){const w=analyzerCanvas.clientWidth,h=analyzerCanvas.clientHeight;if(w<2||h<2||!canvasCtx)return;canvasCtx.clearRect(0,0,w,h);canvasCtx.save();canvasCtx.strokeStyle=withAlpha(colors.primary,.05);canvasCtx.lineWidth=1;for(let i=1;i<4;i++){const y=Math.round(h*i/4)+.5;canvasCtx.beginPath();canvasCtx.moveTo(0,y);canvasCtx.lineTo(w,y);canvasCtx.stroke()}canvasCtx.restore();if(analyzerMode==='bars')drawBars(w,h);else if(analyzerMode==='mirror')drawMirror(w,h);else if(analyzerMode==='wave')drawWave(w,h);else drawRadial(w,h);canvasCtx.save();canvasCtx.font='11px VT323, monospace';canvasCtx.fillStyle=withAlpha(colors.primary,.34);canvasCtx.shadowColor=withAlpha(colors.primary,.35);canvasCtx.shadowBlur=8;canvasCtx.fillText(analyzerMode.toUpperCase(),7,h-6);canvasCtx.restore()}
function drawBars(w,h){const gap=2,barW=(w-(BANDS-1)*gap)/BANDS;for(let i=0;i<BANDS;i++){const v=Math.max(0,Math.min(1,smooth[i]/255)),bh=Math.max(2,v*h*.92),x=i*(barW+gap),y=h-bh,g=canvasCtx.createLinearGradient(0,y,0,h);g.addColorStop(0,colors.bright);g.addColorStop(.42,colors.primary);g.addColorStop(1,colors.deep);canvasCtx.save();canvasCtx.shadowColor=withAlpha(colors.primary,.55*v+.08);canvasCtx.shadowBlur=Math.min(18,14*v+2);canvasCtx.fillStyle=g;roundedBarPath(canvasCtx,x,y,barW,bh,Math.min(3,barW/2));canvasCtx.fill();canvasCtx.restore();const pv=Math.max(0,Math.min(1,peaks[i]/255)),py=h-Math.max(2,pv*h*.92);canvasCtx.fillStyle=withAlpha(colors.bright,.75);canvasCtx.fillRect(x,Math.max(0,py-2),barW,2)}}
function drawMirror(w,h){const gap=2,barW=(w-(BANDS-1)*gap)/BANDS,mid=h/2;for(let i=0;i<BANDS;i++){const v=Math.max(0,Math.min(1,smooth[i]/255)),bh=Math.max(1.5,v*h*.44),x=i*(barW+gap),g=canvasCtx.createLinearGradient(0,mid-bh,0,mid+bh);g.addColorStop(0,colors.bright);g.addColorStop(.5,colors.primary);g.addColorStop(1,colors.deep);canvasCtx.save();canvasCtx.shadowColor=withAlpha(colors.primary,.45*v+.06);canvasCtx.shadowBlur=Math.min(16,12*v+2);canvasCtx.fillStyle=g;roundedBarPath(canvasCtx,x,mid-bh,barW,bh*2,Math.min(3,barW/2));canvasCtx.fill();canvasCtx.restore();const pv=Math.max(0,Math.min(1,peaks[i]/255)),ph=Math.max(1.5,pv*h*.44);canvasCtx.fillStyle=withAlpha(colors.bright,.55);canvasCtx.fillRect(x,mid-ph-1.5,barW,1.5);canvasCtx.fillRect(x,mid+ph,barW,1.5)}canvasCtx.strokeStyle=withAlpha(colors.primary,.18);canvasCtx.beginPath();canvasCtx.moveTo(0,mid+.5);canvasCtx.lineTo(w,mid+.5);canvasCtx.stroke()}
function drawWave(w,h){const pts=[],useReal=activeIsLocal&&realWave&&isPlaying,len=useReal?realWave.length:waveVals.length;for(let i=0;i<len;i++){const x=i/(len-1)*w,v=useReal?(realWave[i]-128)/128:waveVals[i];pts.push({x,y:h/2+v*h*.36})}canvasCtx.save();canvasCtx.globalCompositeOperation='lighter';canvasCtx.beginPath();canvasCtx.moveTo(pts[0].x,h);for(let i=0;i<pts.length-1;i++){const xc=(pts[i].x+pts[i+1].x)/2,yc=(pts[i].y+pts[i+1].y)/2;canvasCtx.quadraticCurveTo(pts[i].x,pts[i].y,xc,yc)}canvasCtx.lineTo(pts[pts.length-1].x,h);canvasCtx.closePath();const fg=canvasCtx.createLinearGradient(0,0,0,h);fg.addColorStop(0,withAlpha(colors.primary,.18));fg.addColorStop(1,withAlpha(colors.deep,.02));canvasCtx.fillStyle=fg;canvasCtx.fill();canvasCtx.restore();canvasCtx.save();canvasCtx.shadowColor=withAlpha(colors.primary,.75);canvasCtx.shadowBlur=14;canvasCtx.strokeStyle=colors.bright;canvasCtx.lineWidth=2.2;canvasCtx.lineJoin='round';canvasCtx.lineCap='round';canvasCtx.beginPath();canvasCtx.moveTo(pts[0].x,pts[0].y);for(let i=0;i<pts.length-1;i++){const xc=(pts[i].x+pts[i+1].x)/2,yc=(pts[i].y+pts[i+1].y)/2;canvasCtx.quadraticCurveTo(pts[i].x,pts[i].y,xc,yc)}canvasCtx.stroke();canvasCtx.restore();canvasCtx.strokeStyle=withAlpha(colors.primary,.12);canvasCtx.beginPath();canvasCtx.moveTo(0,h/2+.5);canvasCtx.lineTo(w,h/2+.5);canvasCtx.stroke()}
function drawRadial(w,h){const cx=w/2,cy=h/2,baseR=Math.min(w,h)*.18,maxLen=Math.min(w,h)*.28,rot=syntheticPhase*.18;canvasCtx.save();canvasCtx.translate(cx,cy);canvasCtx.rotate(rot);for(let i=0;i<BANDS;i++){const v=Math.max(0,Math.min(1,smooth[i]/255)),a=i/BANDS*Math.PI*2,len=baseR+v*maxLen,x1=Math.cos(a)*baseR,y1=Math.sin(a)*baseR,x2=Math.cos(a)*len,y2=Math.sin(a)*len,g=canvasCtx.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,withAlpha(colors.deep,.75));g.addColorStop(.55,colors.primary);g.addColorStop(1,colors.bright);canvasCtx.strokeStyle=g;canvasCtx.lineWidth=Math.max(1.2,Math.min(w,h)/BANDS*.55);canvasCtx.lineCap='round';canvasCtx.shadowColor=withAlpha(colors.primary,.45*v+.08);canvasCtx.shadowBlur=Math.min(16,12*v+2);canvasCtx.beginPath();canvasCtx.moveTo(x1,y1);canvasCtx.lineTo(x2,y2);canvasCtx.stroke()}canvasCtx.restore();canvasCtx.save();canvasCtx.strokeStyle=withAlpha(colors.primary,.18);canvasCtx.shadowColor=withAlpha(colors.primary,.25);canvasCtx.shadowBlur=10;canvasCtx.beginPath();canvasCtx.arc(cx,cy,baseR-2,0,Math.PI*2);canvasCtx.stroke();canvasCtx.restore()}
let lastAnalyzerTime=performance.now();function analyzerLoop(now){const dt=Math.min(.05,(now-lastAnalyzerTime)/1000);lastAnalyzerTime=now;updateAnalyzerData(dt);drawAnalyzer();requestAnimationFrame(analyzerLoop)}
updateThemeColors();resizeAnalyzer();setTimeout(resizeAnalyzer,120);requestAnimationFrame(analyzerLoop);setEQ(currentEQ);buildStationsList();updateSeekUI();
</script>
