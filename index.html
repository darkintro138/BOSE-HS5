<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }

/* ═══════ ТЁМНАЯ ТЕМА ═══════ */
:root, [data-theme="dark"] {
  --blue:#35c8ff; --blue-bright:#aee9ff; --blue-deep:#0a5a8a;
  --screen-bg:#02101d; --screen-glow:rgba(53,200,255,.15);
  --screen-text:var(--blue-bright); --screen-dim:var(--blue);
  --cabinet-1:#2c2c32; --cabinet-2:#1c1c21; --cabinet-3:#111114;
  --console-1:#303038; --console-2:#22222a; --console-3:#121216;
  --speaker-cone:#5a5a64; --speaker-cone-dark:#19191e;
  --speaker-cap:#8a8a95; --speaker-cap-dark:#141418;
  --tweeter:#4a4a52; --tweeter-dark:#0c0c0f;
  --btn-bg:linear-gradient(180deg,#43434c 0%,#26262d 45%,#15151a 100%);
  --btn-color:#8a9aa6; --btn-active-color:#cdf0ff;
  --ring-color:rgba(53,200,255,.55); --brand-color:#b9c3cc;
  --label-color:#6a747c; --screw:#6a6a72; --badge-color:#5c5c66;
  --eq-bar:linear-gradient(to top, var(--blue-deep) 0%, #1e90d8 40%, var(--blue) 75%, var(--blue-bright) 100%);
  --vol-lit:var(--blue); --vol-lit-max:var(--blue-bright); --vol-off:rgba(10,90,138,.22);
  --power-led:#ff3b30;
  --bg-outer:linear-gradient(160deg,#17181c 0%,#0b0c0e 100%);
  --bg-glow:rgba(53,200,255,.07); --overlay-bg:rgba(2,16,29,.98);
  --fader-cap:linear-gradient(180deg,#e8e8ec 0%,#b8b8c0 45%,#88888f 55%,#5a5a62 100%);
  --theme-color:#0b0c0e;
}

/* ═══════ ЗОЛОТАЯ ТЕМА (тёмная, контрастная, позолоченная) ═══════ */
[data-theme="light"] {
  --blue:#ffb02e; --blue-bright:#ffd880; --blue-deep:#8a5a10;
  --screen-bg:#150d02; --screen-glow:rgba(255,176,46,.22);
  --screen-text:#ffc550; --screen-dim:#e09828;
  --cabinet-1:#b09458; --cabinet-2:#8a7040; --cabinet-3:#54401e;
  --console-1:#c4a86c; --console-2:#9a7e48; --console-3:#6e582c;
  --speaker-cone:#4a3c24; --speaker-cone-dark:#241a0c;
  --speaker-cap:#6a5636; --speaker-cap-dark:#161006;
  --tweeter:#5a4830; --tweeter-dark:#20180c;
  --btn-bg:linear-gradient(180deg,#f0d898 0%,#c8a860 45%,#a08440 55%,#74592a 100%);
  --btn-color:#4a3818; --btn-active-color:#241a08;
  --ring-color:rgba(255,176,46,.7); --brand-color:#2e2210;
  --label-color:#4a3a1c; --screw:#8a7444; --badge-color:#3a2e14;
  --eq-bar:linear-gradient(to top, #8a5a10 0%, #d89020 40%, #ffb02e 75%, #ffe0a0 100%);
  --vol-lit:#ffb02e; --vol-lit-max:#ffe0a0; --vol-off:rgba(255,176,46,.15);
  --power-led:#ff4020;
  --bg-outer:linear-gradient(160deg,#332b1c 0%,#14100a 100%);
  --bg-glow:rgba(255,176,46,.1); --overlay-bg:rgba(21,13,2,.98);
  --fader-cap:linear-gradient(180deg,#ffe8b0 0%,#d8b870 45%,#b09048 55%,#806830 100%);
  --theme-color:#14100a;
}

body {
  font-family:'Share Tech Mono','Courier New',monospace;
  background:radial-gradient(ellipse at 50% 0%, var(--bg-glow) 0%, transparent 55%), var(--bg-outer);
  color:#ccc; user-select:none; display:flex; align-items:center; justify-content:center; transition:background .6s;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
}

/* ═══ СИСТЕМА (ШИРЕ) ═══ */
.system { display:flex; gap:14px; align-items:stretch; width:100%; max-width:1400px; height:100%; max-height:640px; }

/* ═══ КОЛОНКИ ═══ */
.speaker { flex:0 0 190px; display:flex; flex-direction:column; }
.cabinet { flex:1; position:relative; border-radius:14px;
  background:linear-gradient(160deg,var(--cabinet-1) 0%,var(--cabinet-2) 40%,var(--cabinet-3) 100%);
  box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 2px 2px rgba(255,255,255,.18), inset 0 -4px 10px rgba(0,0,0,.45), inset 4px 0 8px rgba(0,0,0,.2), inset -4px 0 8px rgba(0,0,0,.2);
  display:flex; flex-direction:column; align-items:center; padding:16px 10px; gap:12px; overflow:hidden; transition:background .6s; }
.cabinet::before { content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(255,255,255,.02) 3px,rgba(255,255,255,.02) 4px); }
body.playing .cabinet { animation:cabVib .38s ease-in-out infinite; }
@keyframes cabVib { 0%,100%{transform:translate(0,0)} 25%{transform:translate(.4px,-.3px)} 50%{transform:translate(-.3px,.4px)} 75%{transform:translate(.3px,.3px)} }
.tweeter { width:52px; height:52px; border-radius:50%; position:relative; margin-top:4px;
  background:radial-gradient(circle at 38% 32%, var(--tweeter) 0%, var(--tweeter-dark) 100%);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.75), inset 0 -1px 2px rgba(255,255,255,.15), 0 3px 8px rgba(0,0,0,.4); }
.tweeter::after { content:''; position:absolute; top:14%; left:18%; width:34%; height:26%; border-radius:50%; background:radial-gradient(ellipse,rgba(255,255,255,.35),transparent 70%); filter:blur(1px); }
body.playing .tweeter { animation:tweeterPulse .19s ease-in-out infinite; }
@keyframes tweeterPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.018)} }
.mid-driver { width:84px; height:84px; border-radius:50%; position:relative;
  background:radial-gradient(circle at 50% 50%, var(--cabinet-2) 0%, var(--cabinet-3) 100%);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; }
.mid-cone { width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, var(--speaker-cone) 0%, var(--speaker-cone-dark) 100%);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.65), inset 0 -2px 4px rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; }
.mid-cone .cap { width:24px; height:24px; border-radius:50%;
  background:radial-gradient(circle at 36% 30%, var(--speaker-cap) 0%, var(--speaker-cap-dark) 100%);
  box-shadow:inset 0 1px 3px rgba(255,255,255,.4), 0 2px 5px rgba(0,0,0,.5); }
body.playing .mid-cone { animation:wooferPump .38s ease-in-out infinite .04s; }
.woofer { width:138px; height:138px; border-radius:50%; position:relative; margin-top:auto;
  background:radial-gradient(circle at 50% 50%, var(--cabinet-2) 0%, var(--cabinet-3) 100%);
  box-shadow:inset 0 5px 14px rgba(0,0,0,.75), inset 0 -2px 5px rgba(255,255,255,.08), 0 4px 12px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; }
.woofer::before { content:''; position:absolute; inset:9px; border-radius:50%; background:radial-gradient(circle, transparent 62%, rgba(0,0,0,.5) 64%, rgba(100,100,110,.35) 72%, rgba(0,0,0,.55) 80%); }
.woofer::after { content:''; position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 50% 4%, var(--screw) 0 2.5px, var(--cabinet-3) 2.5px 4px, transparent 4px),
    radial-gradient(circle at 50% 96%, var(--screw) 0 2.5px, var(--cabinet-3) 2.5px 4px, transparent 4px),
    radial-gradient(circle at 4% 50%, var(--screw) 0 2.5px, var(--cabinet-3) 2.5px 4px, transparent 4px),
    radial-gradient(circle at 96% 50%, var(--screw) 0 2.5px, var(--cabinet-3) 2.5px 4px, transparent 4px); }
.woofer-cone { width:100px; height:100px; border-radius:50%; position:relative; z-index:2;
  background:radial-gradient(circle at 38% 32%, var(--speaker-cone) 0%, var(--speaker-cone-dark) 100%);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.75), inset 0 -3px 6px rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; }
.woofer-cone::before { content:''; position:absolute; inset:8px; border-radius:50%; background:repeating-radial-gradient(circle at 50% 50%, transparent 0 5px, rgba(0,0,0,.18) 5px 6px); }
.dust-cap { width:38px; height:38px; border-radius:50%; position:relative; z-index:3;
  background:radial-gradient(circle at 35% 30%, var(--speaker-cap) 0%, var(--speaker-cap-dark) 100%);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.4), 0 3px 8px rgba(0,0,0,.6); }
body.playing .woofer-cone { animation:wooferPump .38s ease-in-out infinite; }
@keyframes wooferPump { 0%,100%{transform:scale(1)} 42%{transform:scale(1.075)} 70%{transform:scale(.985)} }
.spk-badge { font-family:'Orbitron',sans-serif; font-weight:700; font-size:10px; letter-spacing:2px; color:var(--badge-color); margin-top:8px; }
.bass-port { width:28px; height:28px; border-radius:50%; position:absolute; bottom:50px; background:radial-gradient(circle, #000 55%, var(--cabinet-2) 75%, var(--cabinet-1) 100%); box-shadow:inset 0 3px 6px rgba(0,0,0,1); }
.speaker.left .bass-port { right:12px; } .speaker.right .bass-port { left:12px; }

/* ═══ КОНСОЛЬ ═══ */
.console { flex:1; position:relative; border-radius:16px; min-width:0;
  background:linear-gradient(180deg,var(--console-1) 0%,var(--console-2) 12%,var(--console-3) 100%);
  box-shadow:0 25px 60px rgba(0,0,0,.55), inset 0 2px 2px rgba(255,255,255,.22), inset 0 -5px 12px rgba(0,0,0,.45);
  display:flex; flex-direction:column; padding:10px 16px; overflow:hidden; transition:background .6s; }
.console::before { content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.015) 2px,rgba(255,255,255,.015) 3px); }
.screw { position:absolute; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--screw), var(--cabinet-3) 70%); box-shadow:inset 0 1px 2px rgba(255,255,255,.35), 0 1px 3px rgba(0,0,0,.6); }
.screw::after { content:''; position:absolute; inset:2.5px 1px; background:var(--cabinet-3); border-radius:1px; }
.screw.tl{top:7px;left:7px} .screw.tr{top:7px;right:7px} .screw.bl{bottom:7px;left:7px} .screw.br{bottom:7px;right:7px}

/* ═══ ВЕРХНЯЯ ПАНЕЛЬ + POWER СВЕРХУ ═══ */
.console-top { display:flex; justify-content:space-between; align-items:center; padding:0 14px 8px; z-index:2; }
.brand { font-family:'Orbitron',sans-serif; font-weight:900; font-size:clamp(14px,2.6vw,19px); letter-spacing:3px; color:var(--brand-color); text-shadow:0 1px 0 rgba(255,255,255,.35), 0 -1px 1px rgba(0,0,0,.5); }
.brand-sub { font-family:'VT323',monospace; font-size:clamp(9px,1.8vw,13px); letter-spacing:1.5px; color:var(--label-color); }
.top-right { display:flex; align-items:center; gap:12px; }
.power-led { width:10px; height:10px; border-radius:50%; background:#4a1414; box-shadow:inset 0 1px 2px rgba(0,0,0,.8); transition:all .4s; }
body.on .power-led { background:var(--power-led); box-shadow:0 0 12px var(--power-led), 0 0 26px rgba(255,59,48,.6); animation:ledPulse 2s infinite; }
@keyframes ledPulse { 50%{opacity:.7} }

.pwr-btn { width:clamp(44px,10vw,56px); height:clamp(44px,10vw,56px); border-radius:50%;
  background:var(--btn-bg); border:1px solid rgba(0,0,0,.5); cursor:pointer;
  color:var(--btn-color); font-size:clamp(19px,4.5vw,25px);
  display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.22), inset 0 -4px 7px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.45);
  transition:transform .1s, color .3s; }
.pwr-btn::before { content:''; position:absolute; inset:-5px; border-radius:50%; border:2px solid rgba(255,59,48,.2); transition:all .35s; pointer-events:none; }
body.on .pwr-btn { color:#ff9a90; }
body.on .pwr-btn::before { border-color:rgba(255,59,48,.85); box-shadow:0 0 16px rgba(255,59,48,.55), inset 0 0 8px rgba(255,59,48,.2); }
.pwr-btn:active { transform:translateY(2px); box-shadow:inset 0 3px 8px rgba(0,0,0,.7); }

/* ═══ СРЕДНЯЯ СЕКЦИЯ: ЭКРАН + ФЕЙДЕР ═══ */
.mid-section { z-index:2; flex:1; min-height:0; display:flex; gap:12px; }

.screen-frame { flex:1; min-width:0; border-radius:10px; padding:4px;
  background:linear-gradient(180deg,var(--cabinet-3),var(--cabinet-1));
  box-shadow:inset 0 3px 8px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.15); display:flex; }
.screen { position:relative; border-radius:7px; overflow:hidden; flex:1; background:var(--screen-bg);
  display:flex; flex-direction:column; padding:10px 14px; gap:5px; transition:all .5s; }
body:not(.on) .screen { opacity:.4; }
body:not(.on) .screen-content { opacity:.1; filter:blur(1px); }
body.on .screen { box-shadow:inset 0 0 40px var(--screen-glow), inset 0 0 100px rgba(0,0,0,.3); }
.screen::before { content:''; position:absolute; inset:0; z-index:20; pointer-events:none; background:linear-gradient(165deg, rgba(255,255,255,.06) 0%, transparent 30%, transparent 70%, rgba(255,255,255,.03) 100%); }
.screen::after { content:''; position:absolute; inset:0; z-index:19; pointer-events:none; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px); }
.screen-content { display:flex; flex-direction:column; gap:4px; flex:1; min-height:0; transition:opacity .6s; position:relative; z-index:2; }
.scr-status-row { display:flex; justify-content:space-between; align-items:center; font-family:'VT323',monospace; font-size:clamp(12px,2.2vw,16px); letter-spacing:1.2px; color:var(--screen-dim); text-shadow:0 0 6px var(--screen-glow); opacity:.9; }
.scr-status-row .live { color:#ff5a5a; text-shadow:0 0 8px rgba(255,90,90,.7); display:flex; align-items:center; gap:4px; }
[data-theme="light"] .scr-status-row .live { color:#ff6a4a; }
.live-dot { width:6px; height:6px; border-radius:50%; background:#ff5a5a; box-shadow:0 0 8px #ff5a5a; animation:blink 1s infinite; }
@keyframes blink { 50%{opacity:.2} }
.scr-station { font-family:'Orbitron',sans-serif; font-weight:900; font-size:clamp(17px,3.4vh,32px); letter-spacing:1.5px; color:var(--screen-text); text-shadow:0 0 14px var(--screen-glow); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1; }
.scr-marquee-wrap { overflow:hidden; white-space:nowrap; height:19px; border-top:1px solid var(--screen-glow); border-bottom:1px solid var(--screen-glow); display:flex; align-items:center; }
.scr-marquee { font-family:'VT323',monospace; font-size:clamp(14px,2.6vh,18px); letter-spacing:1.2px; color:var(--screen-dim); text-shadow:0 0 8px var(--screen-glow); display:inline-block; padding-left:100%; animation:marquee 26s linear infinite; }
@keyframes marquee { 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }
.scr-mid { display:flex; gap:14px; align-items:stretch; flex:1; min-height:0; }
.eq { display:flex; gap:2px; align-items:flex-end; flex:1.5; padding:2px 0; }
.eq-bar { flex:1; min-height:2px; position:relative; border-radius:1px; background:var(--eq-bar); box-shadow:0 0 5px var(--screen-glow); transition:height .07s ease-out; }
.eq-bar::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 3px, var(--screen-bg) 3px, var(--screen-bg) 5px); }
.scr-right { flex:1; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; gap:6px; }
.scr-time { font-family:'VT323',monospace; font-size:clamp(34px,6.5vh,60px); line-height:.9; color:var(--screen-text); letter-spacing:2px; text-shadow:0 0 16px var(--screen-glow); }
.vol-display { display:flex; flex-direction:column; align-items:flex-end; gap:2px; width:100%; }
.vol-label { font-family:'VT323',monospace; font-size:clamp(11px,2vh,14px); color:var(--screen-dim); letter-spacing:1.2px; text-shadow:0 0 6px var(--screen-glow); }
.vol-segments { display:flex; gap:2px; }
.vol-seg { width:5px; height:10px; background:var(--vol-off); border-radius:1px; transition:all .15s; }
.vol-seg.lit { background:var(--vol-lit); box-shadow:0 0 5px var(--vol-lit); }
.vol-seg.lit.max { background:var(--vol-lit-max); box-shadow:0 0 6px var(--vol-lit-max); }
.power-hint { position:absolute; inset:0; z-index:25; display:flex; align-items:center; justify-content:center; font-family:'VT323',monospace; font-size:clamp(17px,3.2vh,24px); letter-spacing:3px; color:var(--screen-dim); opacity:.6; animation:blink 2s infinite; pointer-events:none; }
body.on .power-hint { display:none; }

/* ═══════════════════════════════════════
   DJ-ФЕЙДЕР ГРОМКОСТИ (справа)
   ═══════════════════════════════════════ */
.fader-col { flex:0 0 66px; display:flex; flex-direction:column; align-items:center; gap:5px;
  background:linear-gradient(180deg,var(--cabinet-2),var(--cabinet-3));
  border-radius:10px; padding:8px 4px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.12); }
.fader-top-label { font-family:'VT323',monospace; font-size:13px; letter-spacing:2px; color:var(--label-color); }
.fader { position:relative; flex:1; width:100%; display:flex; touch-action:none; cursor:pointer; min-height:60px; }
.fader-scale { width:18px; position:relative; flex-shrink:0; }
.tick { position:absolute; left:2px; height:1.5px; width:6px; background:var(--label-color); opacity:.65; transform:translateY(50%); }
.tick.major { width:13px; opacity:1; height:2px; }
.fader-track-wrap { flex:1; position:relative; display:flex; justify-content:center; }
.fader-track { position:relative; width:13px; height:100%; border-radius:7px;
  background:linear-gradient(90deg,#000 0%,#1c1c22 45%,#08080c 100%);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.15);
  border:1px solid rgba(0,0,0,.65); }
[data-theme="light"] .fader-track { background:linear-gradient(90deg,#1a1206 0%,#2e2210 45%,#120c04 100%); }
.fader-fill { position:absolute; bottom:0; left:1.5px; right:1.5px; height:80%; border-radius:6px;
  background:linear-gradient(to top, var(--blue-deep), var(--blue));
  box-shadow:0 0 10px var(--ring-color); transition:height .06s; }

function toggleFullscreen() {

  { s:"https://stream.radioparadise.com/mp3-192",   n:"Radio Paradise",  g:"ECLECTIC" },
  { s:"https://stream.radioparadise.com/rock-192",  n:"RP Rock Mix",     g:"ROCK" },
  { s:"https://stream.radioparadise.com/mellow-192",n:"RP Mellow Mix",   g:"MELLOW" },
  { s:"https://stream.radioparadise.com/global-192",n:"RP Global Mix",   g:"GLOBAL" },
  { s:"https://jazz24.streamguys1.com/jazz24-mp3",  n:"Jazz24",          g:"JAZZ" },
  { s:"https://kexp-mp3-128.streamguys1.com/kexp128.mp3", n:"KEXP Seattle", g:"INDIE" },
  { s:"https://ice2.somafm.com/groovesalad-128-mp3",n:"Groove Salad Alt",g:"AMBIENT" },
  { s:"https://ice2.somafm.com/dronezone-128-mp3",  n:"Drone Zone Alt",  g:"ATMOSPHERIC" },
  { s:"https://ice2.somafm.com/beatblender-128-mp3",n:"Beat Blender Alt",g:"DEEP HOUSE" },
  { s:"https://ice2.somafm.com/defcon-128-mp3",     n:"DEF CON Alt",     g:"ELECTRONIC" },
  { s:"https://ice2.somafm.com/thetrip-128-mp3",    n:"The Trip Alt",    g:"PROGRESSIVE" },
  { s:"https://ice2.somafm.com/fluid-128-mp3",      n:"Fluid Alt",       g:"LIQUID DNB" },
  { s:"https://ice2.somafm.com/dubstep-128-mp3",    n:"Dub Step Alt",    g:"DUBSTEP" },
  { s:"https://ice2.somafm.com/synthetica-128-mp3", n:"Synthetica Alt",  g:"SYNTHWAVE" },
  { s:"https://ice2.somafm.com/u80s-128-mp3",       n:"Underground 80s Alt",g:"SYNTH POP" },
  { s:"https://ice2.somafm.com/vaporwaves-128-mp3", n:"Vaporwaves Alt",  g:"VAPORWAVE" },
  { s:"https://ice2.somafm.com/indiepop-128-mp3",   n:"Indie Pop Alt",   g:"INDIE POP" },
  { s:"https://ice2.somafm.com/lush-128-mp3",       n:"Lush Alt",        g:"VOCALS" },
  { s:"https://ice2.somafm.com/poptron-128-mp3",    n:"PopTron Alt",     g:"ELECTRO POP" },
  { s:"https://ice2.somafm.com/covers-128-mp3",     n:"Covers Alt",      g:"POP COVERS" }
].map((x,i) => ({ ...x, num:i+1 }));

let powerOn=false, audio=null, isPlaying=false, currentIndex=0;
let startTime=0, timeInterval=null, volume=0.8;
let currentTheme = localStorage.getItem('theme')||'dark';
document.body.setAttribute('data-theme', currentTheme);
updateThemeUI();

// ═══ ЭКВАЛАЙЗЕР ═══
const EQ_BARS=32, eq=document.getElementById('eq');
let eqH=new Array(EQ_BARS).fill(0), eqT=new Array(EQ_BARS).fill(0);
for(let i=0;i<EQ_BARS;i++){const b=document.createElement('div');b.className='eq-bar';b.style.height='2px';eq.appendChild(b);}
function animateEQ(){
  const bars=document.querySelectorAll('.eq-bar');
  if(Math.random()<0.38){
    for(let i=0;i<EQ_BARS;i++){
      if(isPlaying&&powerOn){
        const wave=Math.sin(Date.now()/400+i*0.5)*18+22;
        const bassBias=1-(i/EQ_BARS)*0.35;
        eqT[i]=Math.min(100,(Math.random()*55+wave)*bassBias+15);
      } else eqT[i]=0;
    }
  }
  bars.forEach((b,i)=>{eqH[i]+=(eqT[i]-eqH[i])*0.25;b.style.height=Math.max(2,eqH[i])+'%';});
  requestAnimationFrame(animateEQ);
}
animateEQ();

// ═══ ШКАЛА ФЕЙДЕРА ═══
const faderScale=document.getElementById('faderScale');
for(let i=0;i<=10;i++){
  const t=document.createElement('div');
  t.className='tick'+(i%5===0?' major':'');
  t.style.bottom=(i*10)+'%';
  faderScale.appendChild(t);
}

// ═══ ГРОМКОСТЬ: сегменты на экране + фейдер ═══
const VOL_SEGS=16, volWrap=document.getElementById('volSegments');
for(let i=0;i<VOL_SEGS;i++){const s=document.createElement('div');s.className='vol-seg'+(i>=VOL_SEGS-2?' max':'');volWrap.appendChild(s);}

function renderVolume(){
  const lit=Math.round(volume*VOL_SEGS);
  document.querySelectorAll('.vol-seg').forEach((s,i)=>s.classList.toggle('lit',i<lit));
  document.getElementById('volNum').textContent=lit;
  document.getElementById('faderFill').style.height=(volume*100)+'%';
  document.getElementById('faderCap').style.bottom=(volume*100)+'%';
  document.getElementById('faderValue').textContent=Math.round(volume*100);
  if(audio)audio.volume=volume;
}
renderVolume();

// ═══ DJ-ФЕЙДЕР: управление перетаскиванием ═══
const faderEl=document.getElementById('fader');
const faderTrack=document.querySelector('.fader-track');
let faderDragging=false;

function setVolumeFromPointer(e){
  const rect=faderTrack.getBoundingClientRect();
  let pct=1-(e.clientY-rect.top)/rect.height;
  pct=Math.max(0,Math.min(1,pct));
  volume=Math.round(pct*32)/32; // шаг как у сегментов
  renderVolume();
}
faderEl.addEventListener('pointerdown',e=>{
  faderDragging=true;
  faderEl.setPointerCapture(e.pointerId);
  setVolumeFromPointer(e);
});
faderEl.addEventListener('pointermove',e=>{ if(faderDragging) setVolumeFromPointer(e); });
faderEl.addEventListener('pointerup',()=>{ faderDragging=false; });
faderEl.addEventListener('pointercancel',()=>{ faderDragging=false; });

function volUp(){volume=Math.min(1,volume+0.0625);renderVolume();}
function volDown(){volume=Math.max(0,volume-0.0625);renderVolume();}

// ═══ ТАЙМЕР ═══
function updateTimer(){
  if(!isPlaying)return;
  const e=Math.floor((Date.now()-startTime)/1000);
  document.getElementById('timeDisplay').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
}

// ═══ ТЕМА ═══
function toggleTheme(){
  currentTheme=currentTheme==='dark'?'light':'dark';
  document.body.setAttribute('data-theme',currentTheme);
  localStorage.setItem('theme',currentTheme);
  updateThemeUI();
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',getComputedStyle(document.body).getPropertyValue('--theme-color').trim());
}
function updateThemeUI(){
  const dark=currentTheme==='dark';
  document.getElementById('themeIcon').textContent=dark?'☾':'☀';
  document.getElementById('themeLabel').textContent=dark?'DARK':'GOLD';
  document.getElementById('thmBtn').textContent=dark?'☀':'☾';
}

// ═══ POWER ═══
function togglePower(){
  if(!powerOn){
    powerOn=true; document.body.classList.add('on');
    if(!audio)initAudio();
    document.getElementById('statusText').textContent='HELLO';
    document.getElementById('stationName').textContent='HONGQI HS5';
    setTimeout(()=>{loadStation(currentIndex);audio.play().catch(()=>{document.getElementById('statusText').textContent='PRESS PLAY';});},700);
  } else {
    powerOn=false; isPlaying=false;
    if(audio)audio.pause();
    document.body.classList.remove('on','playing');
    document.getElementById('statusText').textContent='STANDBY';
    setPlayBtn(false);
    document.getElementById('timeDisplay').textContent='00:00';
  }
}

function setPlayBtn(playing){
  document.getElementById('playIco').textContent = playing?'⏸':'▶';
}

function initAudio(){
  audio=new Audio(); audio.preload='auto'; audio.volume=volume;
  audio.addEventListener('playing',()=>{
    isPlaying=true; startTime=Date.now();
    document.body.classList.add('playing');
    setPlayBtn(true);
    document.getElementById('statusText').textContent='PLAY';
    if(timeInterval)clearInterval(timeInterval);
    timeInterval=setInterval(updateTimer,1000);
  });
  audio.addEventListener('pause',()=>{
    isPlaying=false; document.body.classList.remove('playing');
    setPlayBtn(false);
    document.getElementById('statusText').textContent='PAUSE';
  });
  audio.addEventListener('waiting',()=>{document.getElementById('statusText').textContent='BUFFER';});
  audio.addEventListener('error',()=>{
    document.getElementById('statusText').textContent='NO SIGNAL';
    setTimeout(()=>{ if(powerOn) nextStation(); },2000);
  });
}

// ═══ СТАНЦИИ ═══
function loadStation(index){
  if(index<0||index>=stations.length)return;
  currentIndex=index; const s=stations[index];
  if(!audio)return;
  document.getElementById('stationName').textContent=s.n.toUpperCase();
  document.getElementById('marqueeText').textContent=`*** КАНАЛ ${s.num} · ${s.n.toUpperCase()} *** ${s.g} *** HONGQI HS5 BOSE SOUND *** `;
  startTime=Date.now();
  document.getElementById('timeDisplay').textContent='00:00';
  audio.src=s.s; audio.load();
  if(powerOn&&isPlaying)audio.play().catch(e=>console.log(e));
  document.querySelectorAll('.station-item').forEach((el,i)=>el.classList.toggle('active',i===currentIndex));
}

function togglePlay(){ if(!powerOn){togglePower();return;} if(isPlaying)audio.pause(); else audio.play().catch(e=>console.log(e)); }
function stopPlay(){ if(!audio||!powerOn)return; audio.pause(); startTime=Date.now(); document.getElementById('timeDisplay').textContent='00:00'; }
function nextStation(){ if(!powerOn)return; loadStation((currentIndex+1)%stations.length); }
function prevStation(){ if(!powerOn)return; loadStation((currentIndex-1+stations.length)%stations.length); }

function buildStationsList(){
  const grid=document.getElementById('stationsGrid'); grid.innerHTML='';
  stations.forEach((s,i)=>{
    const item=document.createElement('div');
    item.className='station-item'+(i===currentIndex?' active':'');
    item.innerHTML=`<div class="station-num">${String(s.num).padStart(3,'0')}</div>
      <div style="flex:1;min-width:0;overflow:hidden;">
        <div class="station-name-small">${s.n}</div>
        <div class="station-genre-small">${s.g}</div>
      </div>`;
    item.onclick=()=>{loadStation(i);closeStations();if(powerOn&&!isPlaying)audio.play().catch(e=>console.log(e));};
    grid.appendChild(item);
  });
}
buildStationsList();
function openStations(){ if(!powerOn)return; document.getElementById('stationsOverlay').classList.add('show'); buildStationsList(); }
function closeStations(){ document.getElementById('stationsOverlay').classList.remove('show'); }

// ═══ СВАЙПЫ ═══
let touchX=0; const screenEl=document.querySelector('.screen-frame');
screenEl.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});
screenEl.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>50){d>0?prevStation():nextStation();}},{passive:true});

// ═══ КЛАВИАТУРА ═══
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowLeft')prevStation();
  if(e.code==='ArrowRight')nextStation();
  if(e.code==='ArrowUp'){e.preventDefault();volUp();}
  if(e.code==='ArrowDown'){e.preventDefault();volDown();}
  if(e.code==='KeyP')togglePower();
  if(e.code==='KeyT')toggleTheme();
  if(e.code==='KeyF')toggleFullscreen();
  if(e.code==='KeyL'){const ov=document.getElementById('stationsOverlay');ov.classList.contains('show')?closeStations():openStations();}
});
</script>
</body>
</html>
